<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Raw Cargo - Diagnóstico</title>
</head>
<body>
  <h1>Raw Cargo</h1>
  <p id="estado">Conectando...</p>
  <p id="errorGlobal" style="color:red;"></p>

  <hr>
  <h2>Prueba de inicio de sesión</h2>
  <input type="email" id="email" placeholder="Correo"><br><br>
  <input type="password" id="password" placeholder="Contraseña"><br><br>
  <button onclick="probarLogin()">Iniciar sesión</button>
  <p id="estadoLogin"></p>

  <script>
    window.onerror = function(mensaje) {
      document.getElementById("errorGlobal").textContent = "⚠️ Error detectado: " + mensaje;
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const estado = document.getElementById("estado");

    if (typeof window.supabase === "undefined") {
      estado.textContent = "❌ No se pudo cargar la librería de Supabase (revisa tu conexión o algún bloqueador de contenido).";
    } else {
      const SUPABASE_URL = "https://oumjwuuoqeqafwkaeqtl.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_ZEyRCvJrmjcIS5wliTLjjA_LgDEqRJC";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      (async function probarConexion() {
        try {
          const { error } = await supabase.auth.getSession();
          if (error) throw error;
          estado.textContent = "✅ Conexión establecida correctamente con Supabase.";
        } catch (e) {
          estado.textContent = "❌ Error: " + e.message;
        }
      })();

      window.probarLogin = async function () {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const estadoLogin = document.getElementById("estadoLogin");
        estadoLogin.textContent = "Verificando...";
        try {
          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) throw error;
          estadoLogin.textContent = "✅ Sesión iniciada como: " + data.user.email;
        } catch (e) {
          estadoLogin.textContent = "❌ Error: " + e.message;
        }
      };
    }
  </script>
</body>
</html>
