<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Raw Cargo - Diagnóstico</title>
</head>
<body>
  <h1>Raw Cargo</h1>
  <p id="estado">Conectando...</p>

  <hr>
  <h2>Prueba de inicio de sesión</h2>
  <input type="email" id="email" placeholder="Correo"><br><br>
  <input type="password" id="password" placeholder="Contraseña"><br><br>
  <button onclick="probarLogin()">Iniciar sesión</button>
  <p id="estadoLogin"></p>

  <hr>
  <h2>Prueba de Storage</h2>
  <input type="file" id="archivo" accept="image/*"><br><br>
  <button onclick="probarStorage()">Subir archivo de prueba</button>
  <p id="estadoStorage"></p>

  <hr>
  <h2>Prueba de permisos (RLS)</h2>
  <button onclick="probarClientes()">Probar acceso a clientes</button>
  <p id="estadoClientes"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://oumjwuuoqeqafwkaeqtl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ZEyRCvJrmjcIS5wliTLjjA_LgDEqRJC";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async function probarConexion() {
      const estado = document.getElementById("estado");
      try {
        const { error } = await supabase.auth.getSession();
        if (error) throw error;
        estado.textContent = "✅ Conexión establecida correctamente con Supabase.";
      } catch (e) {
        estado.textContent = "❌ Error: " + e.message;
      }
    })();

    window.probarLogin = async function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const estadoLogin = document.getElementById("estadoLogin");
      estadoLogin.textContent = "Verificando...";
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        estadoLogin.textContent = "✅ Sesión iniciada como: " + data.user.email;
      } catch (e) {
        estadoLogin.textContent = "❌ Error: " + e.message;
      }
    };

    window.probarStorage = async function () {
      const estadoStorage = document.getElementById("estadoStorage");
      const input = document.getElementById("archivo");
      if (!input.files.length) {
        estadoStorage.textContent = "❌ Selecciona un archivo primero.";
        return;
      }
      const file = input.files[0];
      estadoStorage.textContent = "Subiendo...";
      try {
        const path = "prueba/" + Date.now() + "-" + file.name;
        const { error: errorSubida } = await supabase.storage.from('adjuntos').upload(path, file);
        if (errorSubida) throw errorSubida;
        const { data, error: errorUrl } = await supabase.storage.from('adjuntos').createSignedUrl(path, 60);
        if (errorUrl) throw errorUrl;
        estadoStorage.innerHTML = "✅ Archivo subido. <a href=\"" + data.signedUrl + "\" target=\"_blank\">Ver archivo (link válido 60s)</a>";
      } catch (e) {
        estadoStorage.textContent = "❌ Error: " + e.message;
      }
    };

    window.probarClientes = async function () {
      const estadoClientes = document.getElementById("estadoClientes");
      estadoClientes.textContent = "Consultando...";
      try {
        const { data, error } = await supabase.from('clientes').select('id, nombre');
        if (error) throw error;
        estadoClientes.textContent = "✅ Acceso correcto. Clientes encontrados: " + data.length;
      } catch (e) {
        estadoClientes.textContent = "❌ Error: " + e.message;
      }
    };
  </script>
</body>
</html>
